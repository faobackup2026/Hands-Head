{"id":"4b00a4322b0f420eb787248c46d7c482","timestamp":"2026-06-09T16:59:13.575564Z","command_id":"ee996b2a23474dd3909958812d586c0f","order":0,"exit_code":0,"stdout":"name: Dependabot Auto-Merge\n\non:\n  pull_request:\n    types: [opened, synchronize, reopened]\n  schedule:\n    - cron: '0 * * * *'  # Run every hour\n  workflow_dispatch:\n\npermissions:\n  contents: write\n  pull-requests: write\n  checks: read\n  repository-projects: read\n\njobs:\n  dependabot-auto-merge:\n    runs-on: ubuntu-latest\n    if: github.actor == 'dependabot[bot]' || github.event_name == 'workflow_dispatch'\n    \n    steps:\n      - name: Checkout repository\n        uses: actions/checkout@v4\n\n      - name: Get open Dependabot PRs\n        id: get-prs\n        uses: actions/github-script@v7\n        with:\n          script: |\n            const { data: prs } = await github.rest.pulls.list({\n              owner: context.repo.owner,\n              repo: context.repo.repo,\n              state: 'open',\n              sort: 'updated',\n              direction: 'desc'\n            });\n            \n            const dependabotPRs = prs.filter(pr => pr.user.login === 'dependabot[bot]');\n            \n            console.log(`Found ${dependabotPRs.length} open Dependabot PRs`);\n            \n            const prData = dependabotPRs.map(pr => ({\n              number: pr.number,\n              title: pr.title,\n              mergeable: pr.mergeable,\n              mergeable_state: pr.mergeable_state,\n              head_sha: pr.head.sha\n            }));\n            \n            core.setOutput('pr_count', dependabotPRs.length);\n            core.setOutput('pr_data', JSON.stringify(prData));\n            \n            core.exportVariable('DEPENDABOT_PR_NUMBERS', dependabotPRs.map(pr => pr.number).join(','));\n\n      - name: Process Dependabot PRs\n        if: steps.get-prs.outputs.pr_count != '0'\n        uses: actions/github-script@v7\n        with:\n          script: |\n            const prNumbers = process.env.DEPENDABOT_PR_NUMBERS \n              ? process.env.DEPENDABOT_PR_NUMBERS.split(',').filter(n => n)\n              : [];\n            \n            console.log(`Processing ${prNumbers.length} PRs`);\n            \n            let mergedCount = 0;\n            let skippedCount = 0;\n            let errorCount = 0;\n            \n            for (const prNumber of prNumbers) {\n              try {\n                console.log(`\\nProcessing PR #${prNumber}`);\n                \n                const { data: pr } = await github.rest.pulls.get({\n                  owner: context.repo.owner,\n                  repo: context.repo.repo,\n                  pull_number: parseInt(prNumber)\n                });\n                \n                console.log(`  Title: ${pr.title}`);\n                console.log(`  Mergeable: ${pr.mergeable}, State: ${pr.mergeable_state}`);\n                \n                if (pr.mergeable !== true) {\n                  console.log(`  Skipping: PR is not mergeable (state: ${pr.mergeable_state})`);\n                  skippedCount++;\n                  continue;\n                }\n                \n                const { data: commits } = await github.rest.pulls.listCommits({\n                  owner: context.repo.owner,\n                  repo: context.repo.repo,\n                  pull_number: parseInt(prNumber)\n                });\n                \n                const latestCommitSha = commits[commits.length - 1].sha;\n                \n                const { data: checks } = await github.rest.checks.listForRef({\n                  owner: context.repo.owner,\n                  repo: context.repo.repo,\n                  ref: latestCommitSha\n                });\n                \n                console.log(`  Checks running: ${checks.check_runs.length}`);\n                \n                if (checks.check_runs.length > 0) {\n                  const checkStatuses = checks.check_runs.map(c => `${c.name}: ${c.conclusion || 'pending'}`);\n                  console.log(`  ${checkStatuses.join(', ')}`);\n                  \n                  const allCompleted = checks.check_runs.every(check => \n                    check.conclusion !== null && check.conclusion !== 'neutral'\n                  );\n                  \n                  if (!allCompleted) {\n                    console.log(`  Skipping: Not all checks have completed`);\n                    skippedCount++;\n                    continue;\n                  }\n                  \n                  const allPassed = checks.check_runs.every(check => \n                    check.conclusion === 'success' || check.conclusion === 'skipped'\n                  );\n                  \n                  if (!allPassed) {\n                    console.log(`  Skipping: Some checks failed`);\n                    skippedCount++;\n                    continue;\n                  }\n                }\n                \n                // Check commit statuses\n                try {\n                  const { data: statuses } = await github.rest.repos.listCommitStatusesForRef({\n                    owner: context.repo.owner,\n                    repo: context.repo.repo,\n                    ref: latestCommitSha\n                  });\n                  \n                  console.log(`  Commit statuses: ${statuses.length}`);\n                  \n                  if (statuses.length > 0) {\n                    const allSuccess = statuses.every(s => s.state === 'success' || s.state === 'pending');\n                    if (!allSuccess) {\n                      const failedStatuses = statuses.filter(s => s.state !== 'success' && s.state !== 'pending');\n                      console.log(`  Failed statuses: ${failedStatuses.map(s => s.context).join(', ')}`);\n                      console.log(`  Skipping: Some commit statuses failed`);\n                      skippedCount++;\n                      continue;\n                    }\n                  }\n                } catch (e) {\n                  console.log(`  No commit statuses or error checking: ${e.message}`);\n                }\n                \n                // Merge the PR\n                try {\n                  await github.rest.pulls.merge({\n                    owner: context.repo.owner,\n                    repo: context.repo.repo,\n                    pull_number: parseInt(prNumber),\n                    merge_method: 'squash'\n                  });\n                  console.log(`  ✓ Successfully merged PR #${prNumber}`);\n                  mergedCount++;\n                } catch (mergeError) {\n                  if (mergeError.message && mergeError.message.includes('Pull Request is already merged')) {\n                    console.log(`  PR already merged`);\n                    mergedCount++;\n                  } else {\n                    console.log(`  Merge failed: ${mergeError.message}`);\n                    errorCount++;\n                  }\n                }\n                \n              } catch (error) {\n                console.log(`  Error processing PR #${prNumber}: ${error.message}`);\n                errorCount++;\n              }\n            }\n            \n            console.log(`\\n=== Summary ===`);\n            console.log(`Merged: ${mergedCount}`);\n            console.log(`Skipped: ${skippedCount}`);\n            console.log(`Errors: ${errorCount}`);\n            \n            core.setOutput('merged_count', mergedCount);\n            core.setOutput('skipped_count', skippedCount);\n            core.setOutput('error_count', errorCount);\n","stderr":null,"kind":"BashOutput"}