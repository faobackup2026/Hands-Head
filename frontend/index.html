<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HANDS & HEAD by Fao Labs</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #6366F1;
            --primary-dark: #4F46E5;
            --secondary: #8B5CF6;
            --bg-dark: #0F172A;
            --bg-surface: #1E293B;
            --bg-elevated: #334155;
            --text-primary: #F8FAFC;
            --text-secondary: #94A3B8;
            --text-muted: #64748B;
            --success: #22C55E;
            --error: #EF4444;
            --warning: #F59E0B;
            --border: #475569;
            --radius: 8px;
            --radius-lg: 12px;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            height: 100vh;
            overflow: hidden;
        }

        /* Layout Principal */
        .app-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* Header */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 24px;
            background: var(--bg-surface);
            border-bottom: 1px solid var(--border);
        }

        .logo-section {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            width: 48px;
            height: 48px;
        }

        .logo-text {
            display: flex;
            flex-direction: column;
        }

        .logo-title {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -0.5px;
        }

        .logo-subtitle {
            font-size: 12px;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 12px;
            background: var(--bg-elevated);
            border-radius: 20px;
            font-size: 13px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--success);
            animation: pulse 2s infinite;
        }

        .status-dot.disconnected {
            background: var(--error);
            animation: none;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .header-actions {
            display: flex;
            gap: 12px;
        }

        .btn {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            border: none;
            border-radius: var(--radius);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-dark);
        }

        .btn-ghost {
            background: transparent;
            color: var(--text-secondary);
        }

        .btn-ghost:hover {
            background: var(--bg-elevated);
            color: var(--text-primary);
        }

        /* Main Content */
        .main-content {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* Sidebar */
        .sidebar {
            width: 260px;
            background: var(--bg-surface);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .sidebar-header {
            padding: 16px;
            border-bottom: 1px solid var(--border);
        }

        .sidebar-title {
            font-size: 12px;
            text-transform: uppercase;
            color: var(--text-muted);
            letter-spacing: 0.5px;
            margin-bottom: 12px;
        }

        .tool-list {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .tool-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            border-radius: var(--radius);
            cursor: pointer;
            transition: all 0.2s;
        }

        .tool-item:hover {
            background: var(--bg-elevated);
        }

        .tool-item.active {
            background: var(--primary);
            color: white;
        }

        .tool-icon {
            width: 20px;
            height: 20px;
            opacity: 0.8;
        }

        .tool-name {
            font-size: 14px;
            font-weight: 500;
        }

        /* Chat Area */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message {
            display: flex;
            gap: 12px;
            max-width: 80%;
        }

        .message.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .message-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .message.assistant .message-avatar {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
        }

        .message.user .message-avatar {
            background: var(--bg-elevated);
        }

        .message-content {
            background: var(--bg-surface);
            padding: 12px 16px;
            border-radius: var(--radius-lg);
            border: 1px solid var(--border);
        }

        .message.user .message-content {
            background: var(--primary);
            border-color: var(--primary);
        }

        .message-text {
            font-size: 14px;
            line-height: 1.6;
            white-space: pre-wrap;
        }

        .message-time {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .message.user .message-time {
            color: rgba(255,255,255,0.7);
        }

        /* Actions Panel */
        .actions-panel {
            background: var(--bg-surface);
            border-top: 1px solid var(--border);
            padding: 12px 24px;
            display: none;
        }

        .actions-panel.visible {
            display: block;
        }

        .actions-title {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .actions-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .action-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 12px;
            background: var(--bg-elevated);
            border-radius: var(--radius);
            font-size: 13px;
        }

        .action-tool {
            font-weight: 600;
            color: var(--primary);
            min-width: 80px;
        }

        .action-obs {
            color: var(--text-secondary);
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* Chat Input */
        .chat-input-area {
            padding: 16px 24px 24px;
            background: var(--bg-dark);
        }

        .chat-input-container {
            display: flex;
            gap: 12px;
            align-items: flex-end;
        }

        .chat-input {
            flex: 1;
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 12px 16px;
            font-size: 14px;
            font-family: inherit;
            color: var(--text-primary);
            resize: none;
            min-height: 48px;
            max-height: 150px;
            outline: none;
            transition: border-color 0.2s;
        }

        .chat-input:focus {
            border-color: var(--primary);
        }

        .chat-input::placeholder {
            color: var(--text-muted);
        }

        .send-btn {
            width: 48px;
            height: 48px;
            background: var(--primary);
            border: none;
            border-radius: var(--radius-lg);
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .send-btn:hover {
            background: var(--primary-dark);
        }

        .send-btn:disabled {
            background: var(--bg-elevated);
            cursor: not-allowed;
        }

        /* Terminal Panel */
        .terminal-panel {
            display: none;
            flex-direction: column;
            background: var(--bg-dark);
            border-left: 1px solid var(--border);
            width: 400px;
        }

        .terminal-panel.visible {
            display: flex;
        }

        .terminal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            background: var(--bg-surface);
            border-bottom: 1px solid var(--border);
        }

        .terminal-title {
            font-size: 13px;
            font-weight: 600;
        }

        .terminal-output {
            flex: 1;
            padding: 16px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            line-height: 1.5;
            overflow-y: auto;
            white-space: pre-wrap;
            color: var(--text-secondary);
        }

        .terminal-input {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px 16px;
            background: var(--bg-surface);
            border-top: 1px solid var(--border);
        }

        .terminal-prompt {
            color: var(--success);
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
        }

        .terminal-cmd {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-primary);
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            outline: none;
        }

        /* File Tree */
        .file-tree-panel {
            display: none;
            flex-direction: column;
            background: var(--bg-surface);
            border-left: 1px solid var(--border);
            width: 280px;
        }

        .file-tree-panel.visible {
            display: flex;
        }

        .file-tree-header {
            padding: 16px;
            border-bottom: 1px solid var(--border);
        }

        .file-tree-title {
            font-size: 14px;
            font-weight: 600;
        }

        .file-tree {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
        }

        .tree-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
        }

        .tree-item:hover {
            background: var(--bg-elevated);
        }

        .tree-icon {
            width: 16px;
            height: 16px;
        }

        /* Settings Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            z-index: 100;
            align-items: center;
            justify-content: center;
        }

        .modal-overlay.visible {
            display: flex;
        }

        .modal {
            background: var(--bg-surface);
            border-radius: var(--radius-lg);
            width: 500px;
            max-width: 90%;
            border: 1px solid var(--border);
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 24px;
            border-bottom: 1px solid var(--border);
        }

        .modal-title {
            font-size: 18px;
            font-weight: 600;
        }

        .modal-close {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 4px;
        }

        .modal-body {
            padding: 24px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .form-input {
            width: 100%;
            padding: 10px 12px;
            background: var(--bg-dark);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            font-size: 14px;
            color: var(--text-primary);
            outline: none;
        }

        .form-input:focus {
            border-color: var(--primary);
        }

        .form-select {
            width: 100%;
            padding: 10px 12px;
            background: var(--bg-dark);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            font-size: 14px;
            color: var(--text-primary);
            outline: none;
        }

        /* Typing indicator */
        .typing-indicator {
            display: none;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: var(--bg-surface);
            border-radius: var(--radius);
            width: fit-content;
        }

        .typing-indicator.visible {
            display: flex;
        }

        .typing-dots {
            display: flex;
            gap: 4px;
        }

        .typing-dot {
            width: 8px;
            height: 8px;
            background: var(--primary);
            border-radius: 50%;
            animation: typing 1.4s infinite;
        }

        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-4px); }
        }

        /* Toast notifications */
        .toast-container {
            position: fixed;
            bottom: 24px;
            right: 24px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 200;
        }

        .toast {
            padding: 12px 20px;
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            font-size: 14px;
            animation: slideIn 0.3s ease;
        }

        .toast.success { border-color: var(--success); }
        .toast.error { border-color: var(--error); }

        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .sidebar { display: none; }
            .terminal-panel { width: 100%; }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="header">
            <div class="logo-section">
                <div class="logo">
                    <svg class="logo-icon" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <!-- Logo HANDS & HEAD -->
                        <circle cx="24" cy="24" r="22" fill="url(#logoGradient)" stroke="#8B5CF6" stroke-width="2"/>
                        <path d="M16 18C16 18 18 14 24 14C30 14 32 18 32 18" stroke="white" stroke-width="2" stroke-linecap="round"/>
                        <circle cx="18" cy="24" r="2" fill="white"/>
                        <circle cx="30" cy="24" r="2" fill="white"/>
                        <path d="M18 30C18 30 20 34 24 34C28 34 30 30 30 30" stroke="white" stroke-width="2" stroke-linecap="round"/>
                        <!-- Hand symbol -->
                        <path d="M36 12L40 8M40 8L42 10M40 8L38 6" stroke="#22C55E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M12 36L8 40M8 40L10 42M8 40L6 38" stroke="#22C55E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <defs>
                            <linearGradient id="logoGradient" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
                                <stop stop-color="#6366F1"/>
                                <stop offset="1" stop-color="#8B5CF6"/>
                            </linearGradient>
                        </defs>
                    </svg>
                    <div class="logo-text">
                        <span class="logo-title">HANDS & HEAD</span>
                        <span class="logo-subtitle">by Fao Labs</span>
                    </div>
                </div>
                <div class="status-badge">
                    <span class="status-dot" id="statusDot"></span>
                    <span id="statusText">Conectando...</span>
                </div>
            </div>
            <div class="header-actions">
                <button class="btn btn-ghost" onclick="toggleTerminal()">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="4 17 10 11 4 5"></polyline>
                        <line x1="12" y1="19" x2="20" y2="19"></line>
                    </svg>
                    Terminal
                </button>
                <button class="btn btn-ghost" onclick="toggleFileTree()">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
                    </svg>
                    Arquivos
                </button>
                <button class="btn btn-ghost" onclick="openSettings()">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="3"></circle>
                        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                    </svg>
                    Config
                </button>
            </div>
        </header>

        <!-- Main Content -->
        <div class="main-content">
            <!-- Sidebar -->
            <aside class="sidebar">
                <div class="sidebar-header">
                    <div class="sidebar-title">Ferramentas</div>
                    <div class="tool-list">
                        <div class="tool-item active" data-tool="chat">
                            <svg class="tool-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                            </svg>
                            <span class="tool-name">Chat</span>
                        </div>
                        <div class="tool-item" data-tool="terminal">
                            <svg class="tool-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <polyline points="4 17 10 11 4 5"></polyline>
                                <line x1="12" y1="19" x2="20" y2="19"></line>
                            </svg>
                            <span class="tool-name">Terminal</span>
                        </div>
                        <div class="tool-item" data-tool="files">
                            <svg class="tool-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
                            </svg>
                            <span class="tool-name">Arquivos</span>
                        </div>
                        <div class="tool-item" data-tool="git">
                            <svg class="tool-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="18" cy="18" r="3"></circle>
                                <circle cx="6" cy="6" r="3"></circle>
                                <path d="M6 21V9a9 9 0 0 0 9 9"></path>
                            </svg>
                            <span class="tool-name">Git</span>
                        </div>
                        <div class="tool-item" data-tool="browser">
                            <svg class="tool-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="12" cy="12" r="10"></circle>
                                <line x1="2" y1="12" x2="22" y2="12"></line>
                                <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
                            </svg>
                            <span class="tool-name">Browser</span>
                        </div>
                    </div>
                </div>
            </aside>

            <!-- Chat Area -->
            <main class="chat-area">
                <div class="chat-messages" id="chatMessages">
                    <!-- Messages will be inserted here -->
                </div>

                <!-- Actions Panel -->
                <div class="actions-panel" id="actionsPanel">
                    <div class="actions-title">Ações Executadas</div>
                    <div class="actions-list" id="actionsList"></div>
                </div>

                <!-- Chat Input -->
                <div class="chat-input-area">
                    <div class="chat-input-container">
                        <textarea 
                            class="chat-input" 
                            id="chatInput" 
                            placeholder="Digite sua mensagem..."
                            rows="1"
                        ></textarea>
                        <button class="send-btn" id="sendBtn" onclick="sendMessage()">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <line x1="22" y1="2" x2="11" y2="13"></line>
                                <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                            </svg>
                        </button>
                    </div>
                </div>
            </main>

            <!-- Terminal Panel -->
            <aside class="terminal-panel" id="terminalPanel">
                <div class="terminal-header">
                    <span class="terminal-title">Terminal</span>
                    <button class="btn btn-ghost" onclick="toggleTerminal()">×</button>
                </div>
                <div class="terminal-output" id="terminalOutput">
                    <div>HANDS & HEAD Terminal</div>
                    <div>Type commands below...</div>
                    <div></div>
                </div>
                <div class="terminal-input">
                    <span class="terminal-prompt">$</span>
                    <input type="text" class="terminal-cmd" id="terminalCmd" placeholder="Comando..." onkeypress="handleTerminalKey(event)">
                </div>
            </aside>

            <!-- File Tree Panel -->
            <aside class="file-tree-panel" id="fileTreePanel">
                <div class="file-tree-header">
                    <span class="file-tree-title">Arquivos</span>
                </div>
                <div class="file-tree" id="fileTree">
                    <div class="tree-item">
                        <span>Carregando...</span>
                    </div>
                </div>
            </aside>
        </div>
    </div>

    <!-- Settings Modal -->
    <div class="modal-overlay" id="settingsModal">
        <div class="modal">
            <div class="modal-header">
                <span class="modal-title">Configurações</span>
                <button class="modal-close" onclick="closeSettings()">×</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label class="form-label">API Key do LLM</label>
                    <input type="password" class="form-input" id="apiKeyInput" placeholder="Cole sua API key...">
                </div>
                <div class="form-group">
                    <label class="form-label">Modelo</label>
                    <select class="form-select" id="modelSelect">
                        <option value="litellm_proxy/minimax-m2.7">MiniMax M2.7</option>
                        <option value="gpt-4o">GPT-4o</option>
                        <option value="claude-3.5-sonnet">Claude 3.5 Sonnet</option>
                    </select>
                </div>
                <button class="btn btn-primary" onclick="saveSettings()" style="width: 100%;">Salvar</button>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container" id="toastContainer"></div>

    <script>
        // State
        let ws = null;
        let connected = false;
        let config = {};
        let terminalHistory = [];
        let historyIndex = -1;

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            initWebSocket();
            initChatInput();
            loadSettings();
        });

        // WebSocket
        function initWebSocket() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.host}/ws`;
            
            ws = new WebSocket(wsUrl);
            
            ws.onopen = () => {
                connected = true;
                updateStatus(true);
                showToast('Conectado ao HANDS & HEAD', 'success');
            };
            
            ws.onclose = () => {
                connected = false;
                updateStatus(false);
                showToast('Conexão perdida. Reconectando...', 'error');
                setTimeout(initWebSocket, 3000);
            };
            
            ws.onerror = () => {
                updateStatus(false);
            };
            
            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                handleMessage(data);
            };
        }

        function updateStatus(isConnected) {
            const dot = document.getElementById('statusDot');
            const text = document.getElementById('statusText');
            
            if (isConnected) {
                dot.classList.remove('disconnected');
                text.textContent = 'Conectado';
            } else {
                dot.classList.add('disconnected');
                text.textContent = 'Desconectado';
            }
        }

        function handleMessage(data) {
            switch(data.type) {
                case 'connected':
                    config = data.config || {};
                    break;
                    
                case 'thinking':
                    showTyping(true);
                    break;
                    
                case 'response':
                    showTyping(false);
                    addMessage('assistant', data.content);
                    break;
                    
                case 'actions':
                    showActions(data.actions);
                    break;
                    
                case 'complete':
                    showTyping(false);
                    break;
                    
                case 'error':
                    showTyping(false);
                    showToast(data.content, 'error');
                    break;
                    
                case 'pong':
                    break;
            }
        }

        // Chat
        function initChatInput() {
            const input = document.getElementById('chatInput');
            
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            });
            
            input.addEventListener('input', () => {
                input.style.height = 'auto';
                input.style.height = Math.min(input.scrollHeight, 150) + 'px';
            });
        }

        function sendMessage() {
            const input = document.getElementById('chatInput');
            const message = input.value.trim();
            
            if (!message || !connected) return;
            
            addMessage('user', message);
            input.value = '';
            input.style.height = 'auto';
            
            ws.send(JSON.stringify({
                type: 'message',
                content: message
            }));
        }

        function addMessage(role, content) {
            const container = document.getElementById('chatMessages');
            const time = new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
            
            const avatar = role === 'assistant' 
                ? `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
                    <circle cx="12" cy="12" r="10"/>
                    <path d="M8 14s1.5 2 4 2 4-2 4-2"/>
                    <line x1="9" y1="9" x2="9.01" y2="9"/>
                    <line x1="15" y1="9" x2="15.01" y2="9"/>
                   </svg>`
                : `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                    <circle cx="12" cy="7" r="4"/>
                   </svg>`;
            
            const message = document.createElement('div');
            message.className = `message ${role}`;
            message.innerHTML = `
                <div class="message-avatar">${avatar}</div>
                <div class="message-content">
                    <div class="message-text">${escapeHtml(content)}</div>
                    <div class="message-time">${time}</div>
                </div>
            `;
            
            container.appendChild(message);
            container.scrollTop = container.scrollHeight;
        }

        function showTyping(show) {
            const container = document.getElementById('chatMessages');
            let typing = document.getElementById('typingIndicator');
            
            if (show) {
                if (!typing) {
                    typing = document.createElement('div');
                    typing.id = 'typingIndicator';
                    typing.className = 'message assistant';
                    typing.innerHTML = `
                        <div class="message-avatar">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
                                <circle cx="12" cy="12" r="10"/>
                                <path d="M8 14s1.5 2 4 2 4-2 4-2"/>
                                <line x1="9" y1="9" x2="9.01" y2="9"/>
                                <line x1="15" y1="9" x2="15.01" y2="9"/>
                            </svg>
                        </div>
                        <div class="message-content">
                            <div class="typing-indicator visible">
                                <div class="typing-dots">
                                    <div class="typing-dot"></div>
                                    <div class="typing-dot"></div>
                                    <div class="typing-dot"></div>
                                </div>
                            </div>
                        </div>
                    `;
                    container.appendChild(typing);
                }
            } else if (typing) {
                typing.remove();
                typing = null;
            }
            
            container.scrollTop = container.scrollHeight;
        }

        function showActions(actions) {
            const panel = document.getElementById('actionsPanel');
            const list = document.getElementById('actionsList');
            
            list.innerHTML = '';
            
            actions.forEach(action => {
                const item = document.createElement('div');
                item.className = 'action-item';
                item.innerHTML = `
                    <span class="action-tool">${action.tool}</span>
                    <span class="action-obs">${escapeHtml(action.observation || '')}</span>
                `;
                list.appendChild(item);
            });
            
            panel.classList.add('visible');
        }

        // Terminal
        function toggleTerminal() {
            const panel = document.getElementById('terminalPanel');
            panel.classList.toggle('visible');
        }

        function handleTerminalKey(e) {
            if (e.key === 'Enter') {
                const input = document.getElementById('terminalCmd');
                const cmd = input.value.trim();
                
                if (cmd) {
                    terminalHistory.push(cmd);
                    historyIndex = terminalHistory.length;
                    executeTerminalCommand(cmd);
                }
                
                input.value = '';
            } else if (e.key === 'ArrowUp') {
                if (historyIndex > 0) {
                    historyIndex--;
                    document.getElementById('terminalCmd').value = terminalHistory[historyIndex];
                }
            } else if (e.key === 'ArrowDown') {
                if (historyIndex < terminalHistory.length - 1) {
                    historyIndex++;
                    document.getElementById('terminalCmd').value = terminalHistory[historyIndex];
                }
            }
        }

        function executeTerminalCommand(cmd) {
            const output = document.getElementById('terminalOutput');
            output.innerHTML += `<div><span style="color: var(--success)">$</span> ${escapeHtml(cmd)}</div>`;
            
            if (ws && connected) {
                ws.send(JSON.stringify({
                    type: 'message',
                    content: `Execute no terminal: ${cmd}`
                }));
            }
        }

        // File Tree
        function toggleFileTree() {
            const panel = document.getElementById('fileTreePanel');
            panel.classList.toggle('visible');
        }

        // Settings
        function openSettings() {
            document.getElementById('settingsModal').classList.add('visible');
        }

        function closeSettings() {
            document.getElementById('settingsModal').classList.remove('visible');
        }

        function saveSettings() {
            const apiKey = document.getElementById('apiKeyInput').value;
            const model = document.getElementById('modelSelect').value;
            
            localStorage.setItem('hands_head_api_key', apiKey);
            localStorage.setItem('hands_head_model', model);
            
            showToast('Configurações salvas', 'success');
            closeSettings();
        }

        function loadSettings() {
            const apiKey = localStorage.getItem('hands_head_api_key');
            const model = localStorage.getItem('hands_head_model') || 'litellm_proxy/minimax-m2.7';
            
            if (apiKey) document.getElementById('apiKeyInput').value = apiKey;
            document.getElementById('modelSelect').value = model;
        }

        // Utilities
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            
            container.appendChild(toast);
            
            setTimeout(() => {
                toast.remove();
            }, 3000);
        }

        // Add welcome message
        setTimeout(() => {
            if (connected) {
                addMessage('assistant', 'Olá! Sou o **HANDS & HEAD**, seu agente de IA por Fao Labs. Como posso ajudá-lo hoje?');
            }
        }, 1000);
    </script>
</body>
</html>
